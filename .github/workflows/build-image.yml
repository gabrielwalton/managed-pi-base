name: build Raspberry Pi image

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      device:
        description: Raspberry Pi device family
        required: true
        default: rpi5
        type: choice
        options:
          - rpi5
          - rpi4
          - rpi3
          - rpizero2w
      release_tag:
        description: Optional existing release tag to add this image to
        required: false
        default: ""
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    strategy:
      matrix:
        device: ${{ fromJSON(github.event_name == 'workflow_dispatch' && format('["{0}"]', inputs.device) || '["rpi4","rpi5"]') }}
    env:
      DEVICE: ${{ matrix.device }}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the official Raspberry Pi image builder
        run: git clone --depth 1 --branch v2.6.0 https://github.com/raspberrypi/rpi-image-gen.git
      - name: Install image-builder dependencies
        run: sudo ./rpi-image-gen/install_deps.sh
      - name: Validate Managed Pi layer metadata
        run: ./rpi-image-gen/rpi-image-gen metadata --lint ./layer/managed-pi-base.yaml
      - name: Build image
        run: ./image/build.sh ./rpi-image-gen "$DEVICE"
      - name: Compress image
        run: |
          image_path=./work/image-managed-pi-base/managed-pi-base.img
          test -f "$image_path"
          xz -T0 -6 "$image_path"
          mkdir -p dist
          mv "$image_path.xz" "dist/managed-pi-base-$DEVICE.img.xz"
          (cd dist && sha256sum *.img.xz > "managed-pi-base-$DEVICE.img.xz.sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: managed-pi-base-${{ env.DEVICE }}
          path: |
            dist/*.img.xz
            dist/*.sha256
          if-no-files-found: error
          retention-days: 90
      - name: Publish versioned image release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in 1 2 3; do
            if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
              break
            fi
            gh release create "$GITHUB_REF_NAME" \
              --title "Managed Pi Base $GITHUB_REF_NAME" \
              --notes "Reusable Raspberry Pi base image. This release has passed the automated image build; complete the hardware acceptance checklist before production rollout." && break
            sleep 2
          done
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
      - name: Add image to an existing release
        if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ inputs.release_tag }}" dist/* --clobber
