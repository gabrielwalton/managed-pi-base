name: build Raspberry Pi image

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      device:
        description: Raspberry Pi device family
        required: true
        default: rpi5
        type: choice
        options:
          - rpi5
          - rpi4
          - rpi3
          - rpizero2w

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    env:
      DEVICE: ${{ inputs.device || 'rpi5' }}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the official Raspberry Pi image builder
        run: git clone --depth 1 --branch v2.6.0 https://github.com/raspberrypi/rpi-image-gen.git
      - name: Install image-builder dependencies
        run: sudo ./rpi-image-gen/install_deps.sh
      - name: Validate Managed Pi layer metadata
        run: ./rpi-image-gen/rpi-image-gen metadata --lint ./layer/managed-pi-base.yaml
      - name: Build image
        run: ./image/build.sh ./rpi-image-gen "$DEVICE"
      - name: Compress image
        run: |
          image_path=./work/image-managed-pi-base/managed-pi-base.img
          test -f "$image_path"
          xz -T0 -6 "$image_path"
          mkdir -p dist
          mv "$image_path.xz" "dist/managed-pi-base-$DEVICE.img.xz"
          (cd dist && sha256sum *.img.xz > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: managed-pi-base-${{ env.DEVICE }}
          path: |
            dist/*.img.xz
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 90
      - name: Publish versioned image release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Managed Pi Base $GITHUB_REF_NAME" \
            --notes "Reusable Raspberry Pi base image. This release has passed the automated image build; complete the hardware acceptance checklist before production rollout."
