name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check -e . pytest
      - run: python -m pytest -q
      - run: python -m compileall -q src
      - run: bash -n scripts/*.sh scripts/managed-pi-firstboot scripts/managed-pi-service-control examples/app/deploy/*.sh
